<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: linear-gradient(145deg, #101218 0%, #1a1020 55%, #8b1d2c 160%);
        color: #e8eaf0;
        font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 64px;
        padding: 48px 72px;
      }
      .mark {
        width: 280px;
        height: 280px;
        flex: 0 0 auto;
        filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.45));
      }
      .copy {
        max-width: 620px;
      }
      .copy h1 {
        font-size: 96px;
        line-height: 1.05;
        letter-spacing: 0.04em;
        margin-bottom: 18px;
      }
      .copy p {
        font-size: 34px;
        line-height: 1.45;
        color: #c8cdd8;
      }
      .bar {
        margin-top: 28px;
        height: 6px;
        width: 180px;
        border-radius: 999px;
        background: #00e5ff;
      }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="2" y="3" width="28" height="26" rx="2" fill="#8B1D2C"/>
      <rect x="5" y="4" width="22" height="2" fill="#6A131F"/>
      <rect x="4" y="8" width="24" height="14" rx="1" fill="#ECE5D3"/>
      <rect x="6" y="10" width="20" height="10" fill="#FFFFFF"/>
      <path d="M12 12h2v2h4v-2h2v6h-2v-2h-4v2h-2z" fill="#8B1D2C"/>
      <rect x="23" y="5" width="4" height="3" fill="#00E5FF"/>
      <rect x="20" y="2" width="3" height="3" fill="#FF7043"/>
      <rect x="6" y="27" width="20" height="2" fill="#E5B83B"/>
    </svg>
    <div class="copy">
      <h1>へろコン</h1>
      <p>ブラウザでファミコンソフトを遊ぶ<br />収録ソフトや手元の .nes を刺してプレイ</p>
      <div class="bar"></div>
    </div>
  </body>
</html>
